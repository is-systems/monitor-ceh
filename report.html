    <script>
        const client = supabase.createClient(
            'https://aoekbmhgbohsgpwqsizv.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvZWtibWhnYm9oc2dwd3FzaXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDU1OTEsImV4cCI6MjEwMjUyMTU5MX0.ikCySPlyg0kPHt0sx34pndAWJAJ9tVCyWonBuG-lLQU'

        async function initApp() {

            const uniqueDetails = [...new Set(activeTasks.map(task => task.СЂР°Р·СЂРµС€РµРЅ_РґРµС‚Р°Р№Р»))];
            
            detailSelect.innerHTML = '<option value="">-- РР·Р±РµСЂРё РґРµС‚Р°Р№Р» --</option>';

        // РљРѕРіР°С‚Рѕ СЂР°Р±РѕС‚РЅРёРєСЉС‚ РёР·Р±РµСЂРµ РґРµС‚Р°Р№Р», РїСЂРѕРјРµРЅСЏРјРµ РјРµРЅСЋС‚Рѕ СЃ РѕРїРµСЂР°С†РёРёС‚Рµ
        document.getElementById('detail').addEventListener('change', function(e) {
            const selectedDetail = e.target.value;
            const opSelect = document.getElementById('operation');
            
            opSelect.innerHTML = '<option value="">-- РР·Р±РµСЂРё РѕРїРµСЂР°С†РёСЏ --</option>';
            
            if (!selectedDetail) return;

            // Р¤РёР»С‚СЂРёСЂР°РјРµ РѕРїРµСЂР°С†РёРёС‚Рµ СЃР°РјРѕ Р·Р° РёР·Р±СЂР°РЅРёСЏ РґРµС‚Р°Р№Р»
            const relevantOps = activeTasks.filter(task => task.СЂР°Р·СЂРµС€РµРЅ_РґРµС‚Р°Р№Р» === selectedDetail);
            
            relevantOps.forEach(op => {
                opSelect.innerHTML += `<option value="${op.РёРјРµ_РѕРїРµСЂР°С†РёСЏ}">${op.РЅРѕРјРµСЂ_РѕРїРµСЂР°С†РёСЏ} - ${op.РёРјРµ_РѕРїРµСЂР°С†РёСЏ}</option>`;

        // РљР°РєРІРѕ СЃРµ СЃР»СѓС‡РІР°, РєРѕРіР°С‚Рѕ СЃРµ РЅР°С‚РёСЃРЅРµ Р±СѓС‚РѕРЅСЉС‚ "РР·РїСЂР°С‚Рё"
        document.getElementById('reportForm').addEventListener('submit', async function(e) {

            const btn = document.querySelector('button');
            const msg = document.getElementById('message');
            btn.disabled = true;
            btn.innerText = 'РР·РїСЂР°С‰Р°РЅРµ...';

            const payload = {
                "ID Р”РµС‚Р°Р№Р»": document.getElementById('detail').value,
                "РћРїРµСЂР°С‚РѕСЂ": document.getElementById('operator').value,
                "РљРѕР»РёС‡РµСЃС‚РІРѕ": document.getElementById('quantity').value,
                "РћРїРµСЂР°С†РёСЏ": document.getElementById('operation').value,
                "РЎС‚Р°С‚СѓСЃ": "РћС‚С‡РµС‚РµРЅРѕ", // РЎР»Р°РіР°РјРµ Р±Р°Р·РѕРІ СЃС‚Р°С‚СѓСЃ, Р·Р° РґР° РЅРµ РѕСЃС‚Р°РІР° РїСЂР°Р·РЅР° РєРѕР»РѕРЅР°С‚Р°

            };

            const { error } = await client.from('otcheti').insert([payload]);

            if (error) {

                document.getElementById('reportForm').reset(); // РР·С‡РёСЃС‚РІР° С„РѕСЂРјР°С‚Р°
                document.getElementById('operation').innerHTML = '<option value="">-- РџСЉСЂРІРѕ РёР·Р±РµСЂРё РґРµС‚Р°Р№Р» --</option>';

            btn.disabled = false;
