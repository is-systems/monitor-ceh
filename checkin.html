<!DOCTYPE html>

    <link rel="manifest" href="manifest.json">

    <style>

            justify-content: center;

        }
        .status-in { background-color: #dcfce7; color: #166534; border: 2px solid #bbf7d0; }
        .status-out { background-color: #fee2e2; color: #991b1b; border: 2px solid #fca5a5; }
        
        .form-group { display: flex; flex-direction: column; text-align: left; margin-bottom: 25px; width: 100%; }
        .form-group label { font-size: 0.8em; font-weight: 700; color: #475569; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { padding: 14px 16px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1.05em; outline: none; transition: all 0.2s; color: #334155; }
        .form-group input:focus { border-color: #4338ca; box-shadow: 0 0 0 3px rgba(67, 56, 202, 0.1); }
        
        .btn { 
            width: 100%; 
            padding: 16px; 
            border: none; 
            border-radius: 10px; 
            font-size: 1.1em; 
            font-weight: 700; 
            cursor: pointer; 
            color: white; 
            transition: all 0.2s; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .btn-in { background-color: #16a34a; }
        .btn-in:hover { background-color: #15803d; }
        .btn-out { background-color: #dc2626; }
        .btn-out:hover { background-color: #b91c1c; }
        
        .clock { font-size: 3em; font-weight: 900; color: #1e293b; margin-bottom: 2px; }
        .date { color: #64748b; font-size: 1em; font-weight: 600; margin-bottom: 30px; text-transform: capitalize; }
    </style>
</head>
<body>

    <div class="card">

        <div id="statusBanner" class="status-banner">Р—Р°СЂРµР¶РґР°РЅРµ...</div>

        <form id="checkinForm" onsubmit="handleSubmit(event)">

                <input type="email" id="emailInput" required placeholder="example@gmail.com" autocomplete="email">
            </div>
            <button type="submit" id="submitBtn" class="btn">РџРѕС‚РІСЉСЂРґРё</button>

    </div>

    <script>
        const client = supabase.createClient(
          'https://aoekbmhgbohsgpwqsizv.supabase.co', 
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvZWtibWhnYm9oc2dwd3FzaXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDU1OTEsImV4cCI6MjEwMjUyMTU5MX0.ikCySPlyg0kPHt0sx34pndAWJAJ9tVCyWonBuG-lLQU'
        );

        // РљРѕРѕСЂРґРёРЅР°С‚Рё РЅР° С†РµС…Р°
        const WORKSHOP_LAT = 41.8937;
        const WORKSHOP_LNG = 23.4875;

        // Р§РµС‚РµРј РїР°СЂР°РјРµС‚СЉСЂР° РѕС‚ URL Р°РґСЂРµСЃР° (?action=in РёР»Рё ?action=out)
        const urlParams = new URLSearchParams(window.location.search);
        const actionParam = urlParams.get('action'); 
        
        const actionText = actionParam === 'out' ? 'РР·Р»РёР·Р°РЅРµ' : 'Р’Р»РёР·Р°РЅРµ';
        
        const banner = document.getElementById('statusBanner');
        const btn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('emailInput');

        // РќР°СЃС‚СЂРѕР№РІР°РјРµ С†РІРµС‚РѕРІРµС‚Рµ СЃРїСЂСЏРјРѕ С‚РѕРІР° РєРѕР№ РєРѕРґ Рµ СЃРєР°РЅРёСЂР°РЅ
        if (actionParam === 'out') {
            banner.innerText = 'рџ”ґ РР—Р›РР—РђРќР• РћРў РЎРњР•РќРђ';
            banner.className = 'status-banner status-out';
            btn.innerText = 'РџРѕС‚РІСЉСЂРґРё РР—Р›РР—РђРќР•';
            btn.className = 'btn btn-out';
        } else {
            banner.innerText = 'рџџў Р’Р›РР—РђРќР• РќРђ РЎРњР•РќРђ';
            banner.className = 'status-banner status-in';
            btn.innerText = 'РџРѕС‚РІСЉСЂРґРё Р’Р›РР—РђРќР•';
            btn.className = 'btn btn-in';
        }

        // РђРІС‚РѕРјР°С‚РёС‡РЅРѕ РїРѕРїСЉР»РІР°РјРµ РёРјРµР№Р»Р°, Р°РєРѕ С‚РµР»РµС„РѕРЅСЉС‚ РіРѕ Рµ Р·Р°РїРѕРјРЅРёР» РѕС‚ РїСЂРµРґРёС€РЅРѕ С‡РµРєРёСЂР°РЅРµ
        const savedEmail = localStorage.getItem('workerEmail');
        if (savedEmail) {
            emailInput.value = savedEmail;
        }

        // Р”РёРЅР°РјРёС‡РµРЅ С‡Р°СЃРѕРІРЅРёРє
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('bg-BG', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date').innerText = now.toLocaleDateString('bg-BG', {weekday: 'long', day: '2-digit', month: '2-digit'});
        }
        setInterval(updateTime, 1000);
        updateTime();

        // РР·С‡РёСЃР»СЏРІР°РЅРµ РЅР° СЂР°Р·СЃС‚РѕСЏРЅРёРµ (Haversine С„РѕСЂРјСѓР»Р°)
        function getDistanceInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // СЂР°РґРёСѓСЃ РЅР° Р—РµРјСЏС‚Р° РІ РјРµС‚СЂРё
            const p1 = lat1 * Math.PI/180;
            const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        // Р’Р·РёРјР°РЅРµ РЅР° Р»РѕРєР°С†РёСЏ
        function getUserLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve({ loc: "РќРµ СЃРµ РїРѕРґРґСЉСЂР¶Р°", note: "вљ пёЏ GPS РќР• РЎР• РџРћР”Р”РЄР Р–Рђ" });
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const distance = getDistanceInMeters(lat, lng, WORKSHOP_LAT, WORKSHOP_LNG);
                        let note = distance > 200 ? `вљ пёЏ РР—Р’РЄРќ РћР‘Р•РљРўРђ (${distance}Рј)` : "";
                        resolve({ loc: `${lat.toFixed(5)}, ${lng.toFixed(5)}`, note: note });
                    },
                    (error) => {
                        resolve({ loc: "GPS РћС‚РєР°Р·Р°РЅ", note: "вљ пёЏ Р›РРџРЎР’Рђ Р›РћРљРђР¦РРЇ" });
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            });
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const email = emailInput.value.trim().toLowerCase();
            if (!email) return;

            try {
                // 1. РџР РћР’Р•Р РљРђ Р—Рђ Р”РЈР‘Р›РР РђРќР•
                Swal.fire({ title: 'РџСЂРѕРІРµСЂРєР°...', text: 'РЎРІРµСЂСЏРІР°РЅРµ СЃ Р±Р°Р·Р°С‚Р° РґР°РЅРЅРё', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                
                const { data: lastRecord, error: fetchErr } = await client
                    .from('chekiraniya')
                    .select('Р”РµР№СЃС‚РІРёРµ')
                    .eq('РРјРµР№Р»', email)
                    .order('Р’СЂРµРјРµ', { ascending: false })
                    .limit(1);

                if (fetchErr) throw fetchErr;

                if (lastRecord && lastRecord.length > 0) {
                    const lastAction = lastRecord[0]['Р”РµР№СЃС‚РІРёРµ'];
                    if (actionText === 'Р’Р»РёР·Р°РЅРµ' && lastAction === 'Р’Р»РёР·Р°РЅРµ') {
                        Swal.fire('Р’РЅРёРјР°РЅРёРµ!', 'Р’РµС‡Рµ СЃС‚Рµ С‡РµРєРёСЂР°РЅРё Р·Р° Р’Р»РёР·Р°РЅРµ. РџСЉСЂРІРѕ С‚СЂСЏР±РІР° РґР° РјР°СЂРєРёСЂР°С‚Рµ РР·Р»РёР·Р°РЅРµ.', 'warning');
                        return;
                    }
                    if (actionText === 'РР·Р»РёР·Р°РЅРµ' && (lastAction === 'РР·Р»РёР·Р°РЅРµ' || lastAction === 'РђРІС‚Рѕ РёР·Р»РёР·Р°РЅРµ')) {
                        Swal.fire('Р’РЅРёРјР°РЅРёРµ!', 'Р’РµС‡Рµ СЃС‚Рµ СЃРµ РёР·РїРёСЃР°Р»Рё РѕС‚ С†РµС…Р°.', 'warning');
                        return;
                    }
                }

                // 2. Р’Р—РРњРђРќР• РќРђ Р›РћРљРђР¦РРЇ
                Swal.fire({ title: 'РџСЂРѕРІРµСЂРєР° РЅР° Р»РѕРєР°С†РёСЏ...', text: 'РњРѕР»СЏ, СЂР°Р·СЂРµС€РµС‚Рµ РґРѕСЃС‚СЉРї РґРѕ GPS, Р°РєРѕ Р±СЉРґРµС‚Рµ РїРѕРїРёС‚Р°РЅРё.', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const geoInfo = await getUserLocation();

                // 3. Р—РђРџРРЎР’РђРќР•
                Swal.fire({ title: 'Р—Р°РїРёСЃРІР°РЅРµ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                const { error: insertErr } = await client
                    .from('chekiraniya')
                    .insert([{
                        "РРјРµР№Р»": email,
                        "Р”РµР№СЃС‚РІРёРµ": actionText,
                        "Р’СЂРµРјРµ": new Date().toISOString(),
                        "Р›РѕРєР°С†РёСЏ": geoInfo.loc,
                        "Р‘РµР»РµР¶РєР°": geoInfo.note
                    }]);

                if (insertErr) throw insertErr;

                // Р—Р°РїРѕРјРЅСЏРјРµ РёРјРµР№Р»Р° РІ РїР°РјРµС‚С‚Р° РЅР° Р±СЂР°СѓР·СЉСЂР° РЅР° С‚РѕР·Рё С‚РµР»РµС„РѕРЅ
                localStorage.setItem('workerEmail', email);

                Swal.fire({
                    icon: 'success',
                    title: 'РЈСЃРїРµС€РЅРѕ РѕС‚С‡РµС‚РµРЅРѕ!',
                    text: `${actionText} Р±РµС€Рµ Р·Р°РїРёСЃР°РЅРѕ Р·Р° ${email}`,
                    timer: 2500,
                    showConfirmButton: false
                }).then(() => {
                    // РљСЂР°СЃРёРІ Р·Р°РІСЉСЂС€РµРє, Р·Р° РґР° Р·РЅР°Рµ С‡РѕРІРµРєСЉС‚, С‡Рµ Рµ РіРѕС‚РѕРІ
                    document.body.innerHTML = `
                        <div style="text-align:center; padding:30px; max-width:400px; background:white; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.05);">
                            <h2 style="color: #16a34a; margin-bottom:10px;">вњЁ Р‘Р»Р°РіРѕРґР°СЂРёРј РІРё!</h2>
                            <p style="color: #475569; font-size:1.1em;">Р’Р°С€РёСЏС‚ С‡Р°СЃ Рµ СЂРµРіРёСЃС‚СЂРёСЂР°РЅ СѓСЃРїРµС€РЅРѕ.<br>РњРѕР¶Рµ РґР° Р·Р°С‚РІРѕСЂРёС‚Рµ С‚РѕР·Рё РїСЂРѕР·РѕСЂРµС†.</p>
                        </div>
                    `;
                });

            } catch (err) {
                console.error(err);
                Swal.fire('вќЊ Р“СЂРµС€РєР° РїСЂРё РІСЂСЉР·РєР°С‚Р°', 'РњРѕР»СЏ, РїСЂРѕРІРµСЂРµС‚Рµ РёРЅС‚РµСЂРЅРµС‚Р° СЃРё Рё РѕРїРёС‚Р°Р№С‚Рµ РѕС‚РЅРѕРІРѕ.', 'error');
            }
        }
    </script>
