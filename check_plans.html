<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
    <div id="out" style="font-family: monospace; white-space: pre-wrap;"></div>
    <script>
        const url = 'https://aoekbmhgbohsgpwqsizv.supabase.co/rest/v1';
        const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvZWtibWhnYm9oc2dwd3FzaXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDU1OTEsImV4cCI6MjEwMjUyMTU5MX0.ikCySPlyg0kPHt0sx34pndAWJAJ9tVCyWonBuG-lLQU';
        const headers = { 'apikey': key, 'Authorization': 'Bearer ' + key };
        
        async function run() {
            let res = await fetch(url + '/plan?select=*', {headers});
            let plans = await res.json();
            
            let myPlans = plans.filter(p => String(p['Детайл']).trim().toLowerCase() === 'статорен пак. вар. 11' || String(p['Родител']).trim().toLowerCase() === 'статорен пак. вар. 11');
            
            let out = document.getElementById('out');
            out.innerHTML = "Намерени планове за 'Статорен пак. вар. 11':\n\n";
            myPlans.forEach(p => {
                out.innerHTML += JSON.stringify(p, null, 2) + "\n";
            });
            
            out.innerHTML += "\n--- ГОТОВО ---";
        }
        run();
    </script>
</body>
</html>
