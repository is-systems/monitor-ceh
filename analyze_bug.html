<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Анализ на 1/4" (R3)#</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; padding: 20px; font-size: 14px; }
        h1 { color: #fff; }
        .log-section { border: 1px solid #333; padding: 10px; margin-bottom: 20px; background: #222; }
    </style>
</head>
<body>
    <h1>Детайлен лог на изчисленията за 1/4" (R3)# и 1/4"</h1>
    <div id="out">Зареждане на данни от базата...<br></div>

    <script>
        const url = 'https://aoekbmhgbohsgpwqsizv.supabase.co/rest/v1';
        const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvZWtibWhnYm9oc2dwd3FzaXp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NDU1OTEsImV4cCI6MjEwMjUyMTU5MX0.ikCySPlyg0kPHt0sx34pndAWJAJ9tVCyWonBuG-lLQU';
        const headers = { 'apikey': key, 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json' };
        
        async function fetchAll(endpoint) {
            let all = []; let offset = 0;
            while(true) {
                let res = await fetch(`${url}/${endpoint}?select=*&limit=1000&offset=${offset}`, {headers});
                if (!res.ok) throw new Error(`HTTP error! status: ${res.status} on endpoint ${endpoint}`);
                let data = await res.json();
                if(!Array.isArray(data)) throw new Error("Expected array but got: " + JSON.stringify(data));
                if(data.length === 0) break;
                all = all.concat(data);
                offset += 1000;
            }
            return all;
        }

        function log(msg) {
            document.getElementById('out').innerHTML += msg + "<br>";
        }

        async function run() {
            try {
                let [bom, routesData, allOtcheti, plansRes] = await Promise.all([
                    fetchAll('bom'),
                    fetchAll('marshruti'),
                    fetchAll('otcheti'),
                    fetch(`${url}/plans?select=*`, {headers}).then(r => r.json())
                ]);
                
                log("<br><b>=== 1. ПРОВЕРКА НА БОМ ===</b>");
                let parentsOfChild = bom.filter(b => String(b['ID Компонент']).trim().toLowerCase() === '1/4"');
                log("Всички редове, където 1/4\" е дете:");
                parentsOfChild.forEach(p => {
                    log(` - Родител: ${p['ID Родител']}, Компонент: ${p['ID Компонент']}, Количество: ${p['Количество']}`);
                });

                log("<br><b>=== 2. ПРОВЕРКА НА МАРШРУТНА КАРТА ===</b>");
                let routes = routesData.filter(r => String(r['Код на детайла']||'').trim().toLowerCase() === '1/4" (r3)#');
                routes.sort((a,b) => (parseFloat(a['№ Операция'])||0) - (parseFloat(b['№ Операция'])||0));
                log(`Намерени ${routes.length} операции за 1/4" (R3)#:`);
                routes.forEach(r => log(` - Оп. ${r['№ Операция']}: ${r['Име на операция']}`));

                let opNames = routes.map(r => String(r['Име на операция']).trim().toLowerCase());
                let duplicates = opNames.filter((item, index) => opNames.indexOf(item) !== index);
                if (duplicates.length > 0) {
                    log(`<span style="color:red; font-weight:bold;">ВНИМАНИЕ: Намерени повтарящи се имена на операции: ${duplicates.join(', ')}</span>`);
                } else {
                    log("<span style='color:lime;'>Няма повтарящи се имена на операции.</span>");
                }

                log("<br><b>=== 3. ОТЧЕТЕНИ БРОЙКИ (OTCHETI) ===</b>");
                let myOtcheti = allOtcheti.filter(o => String(o['ID Детайл']).trim().toLowerCase() === '1/4" (r3)#');
                let completedOps = {};
                myOtcheti.forEach(r => {
                    let op = String(r['Операция']).trim().toLowerCase();
                    let qty = parseFloat(r['Количество']) || 0;
                    if (r['Статус'] === 'Отчетено' && r['Оператор'] !== 'СИСТЕМА (Експедиция)' && !(r['Оператор'] === 'СИСТЕМА (Корекция наличност)' && qty < 0) && op !== 'възстановен' && !op.startsWith('вложен в ')) { 
                        completedOps[op] = (completedOps[op] || 0) + qty; 
                    }
                });
                log("Сума на отчетените (от операторите) бройки по операции:");
                Object.keys(completedOps).forEach(k => log(` - ${k}: ${completedOps[k]} бр.`));

                log("<br><b>=== 4. СИМУЛАЦИЯ НА CHECK_NOW.JS (МОНИТОР) ===</b>");
                let grossCompletedOps = {};
                let scrappedOps = {};
                Object.keys(completedOps).forEach(op => {
                    grossCompletedOps['1/4" (r3)#_' + op] = completedOps[op];
                });

                for (let i = routes.length - 2; i >= 0; i--) {
                    let opKey = '1/4" (r3)#_' + String(routes[i]['Име на операция']).trim().toLowerCase();
                    let nextOpKey = '1/4" (r3)#_' + String(routes[i+1]['Име на операция']).trim().toLowerCase();
                    let requiredFromMe = (grossCompletedOps[nextOpKey] || 0) + (scrappedOps[nextOpKey] || 0);
                    grossCompletedOps[opKey] = Math.max(grossCompletedOps[opKey] || 0, requiredFromMe);
                }
                
                log("grossCompletedOps след обратното разпространение (forward/backward):");
                routes.forEach(r => {
                    let opKey = '1/4" (r3)#_' + String(r['Име на операция']).trim().toLowerCase();
                    log(` - ${opKey} = ${grossCompletedOps[opKey] || 0} бр.`);
                });

                if(routes.length > 0) {
                    let firstOpKey = '1/4" (r3)#_' + String(routes[0]['Име на операция']).trim().toLowerCase();
                    let parentConsumed = grossCompletedOps[firstOpKey] || 0;
                    log(`\n=> Първа операция е: ${firstOpKey}. Стойност = ${parentConsumed} бр.`);
                    log(`=> Следователно 1/4" (R3)# е консумирал: ${parentConsumed} бр. от своите деца (вкл. 1/4")!`);
                }

                log("<br><b style='color:yellow'>ГОТОВО. Копирайте целия този текст и ми го изпратете в чата!</b>");
            } catch(e) {
                log("<br><span style='color:red'>ГРЕШКА: " + e.stack + "</span>");
            }
        }
        run();
    </script>
</body>
</html>
